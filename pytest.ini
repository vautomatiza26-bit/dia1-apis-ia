# Configuración de pytest.
# - testpaths: solo busca tests dentro de tests/, así nunca ejecuta por
#   error scripts como eval_extraccion_facturas.py (que llama a la API de pago).
# - pythonpath: los scripts viven en la raíz del repo; con esto los tests
#   pueden hacer "import semana3_agente_sql" sin tocar sys.path a mano.
[pytest]
testpaths = tests
pythonpath = .
