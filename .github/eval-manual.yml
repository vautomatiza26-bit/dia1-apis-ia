# .github/workflows/eval-manual.yml
#
# A diferencia de ci.yml, este workflow SOLO se ejecuta cuando TÚ lo
# lanzas manualmente desde la pestaña "Actions" de GitHub (workflow_dispatch).
# No se dispara automáticamente en cada push, porque llama a la API
# real de Claude para ejecutar los evals - y eso cuesta dinero.
#
# Esta es una decisión de diseño real que un AI Engineer tiene que
# tomar: qué comprobaciones son gratis y pueden ser automáticas
# siempre, y cuáles cuestan dinero y deben ser deliberadas.

name: Evaluación de extracción (manual)

on:
  workflow_dispatch:  # <- esto es lo que lo hace "solo bajo demanda"

jobs:
  ejecutar-evals:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar la suite de evaluación
        env:
          # La clave se lee de un "Secret" de GitHub, NUNCA del código.
          # Se configura en: Settings > Secrets and variables > Actions
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python eval_extraccion_facturas.py
